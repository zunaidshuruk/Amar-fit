name: Compile check

# Compiles the app and runs the unit tests on every push to a claude/** branch and on every
# pull request, so compile errors show up before anything is released.
"on":
  push:
    branches:
      - "claude/**"
  pull_request: {}
  workflow_dispatch: {}

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Restore debug keystore if the repo copy is missing or wrong
        run: |
          EXPECTED=4d6742b2662bfcbbb8e0a6f693d3fb939f4d2d10a446336af85a619f275f0faa
          if [ ! -f debug.keystore ] || [ "$(sha256sum debug.keystore | cut -d' ' -f1)" != "$EXPECTED" ]; then
            echo "::warning::debug.keystore was missing or different in the repo. Restoring the known-good copy for this build. Please restore it in the repo too."
            echo '' | base64 --decode > debug.keystore
          fi
          test "$(sha256sum debug.keystore | cut -d' ' -f1)" = "$EXPECTED"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON is empty or missing"
            exit 1
          fi
          if printf '%s' "$GOOGLE_SERVICES_JSON" | python3 -c 'import sys,json; json.load(sys.stdin)' 2>/dev/null; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          fi
          python3 -c 'import json; d=json.load(open("app/google-services.json")); assert isinstance(d, dict) and d.get("client")' || { echo "::error::app/google-services.json is not a valid Firebase config"; exit 1; }

      - name: Compile (assembleDebug)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report compiler errors as annotations
        if: failure()
        run: |
          grep -E "^e: " build.log | head -60 | while IFS= read -r line; do
            echo "::error title=Kotlin compiler::${line}"
          done
          grep -E "error:|FAILED|What went wrong" -A3 build.log | head -40 | while IFS= read -r line; do
            echo "::warning title=Gradle::${line}"
          done

      - name: Unit tests
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon 2>&1 | tee test.log

      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = fails = errs = skipped = 0
          bad = []
          for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r = ET.parse(p).getroot()
              total += int(r.get('tests', 0)); fails += int(r.get('failures', 0))
              errs += int(r.get('errors', 0)); skipped += int(r.get('skipped', 0))
              if int(r.get('failures', 0)) + int(r.get('errors', 0)):
                  bad.append(r.get('name').split('.')[-1])
          print("::notice title=Unit tests::%d tests, %d failures, %d errors, %d skipped. Failing classes: %s" % (total, fails, errs, skipped, ', '.join(bad) or 'none'))
          PY
