name: Build and Attach APK to Release

"on":
  push:
    tags:
      - "[0-9]+"
  workflow_dispatch: {}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Pre-flight checks
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          fail=0
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$CODE" != "$TAG" ]; then echo "::error::Tag '$TAG' does not match versionCode '$CODE' in app/build.gradle.kts"; fail=1; fi
          if [ ! -f debug.keystore ]; then echo "::error::debug.keystore is missing from the repo root"; fail=1;
          elif [ "$(sha256sum debug.keystore | cut -d' ' -f1)" != "4d6742b2662bfcbbb8e0a6f693d3fb939f4d2d10a446336af85a619f275f0faa" ]; then echo "::error::debug.keystore checksum does not match the known-good file"; fail=1; fi
          for v in GEMINI_API_KEY YOUTUBE_API_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is missing or empty"; fail=1; fi
          done
          exit $fail

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON is empty or missing"
            exit 1
          fi
          if printf '%s' "$GOOGLE_SERVICES_JSON" | python3 -c 'import sys,json; json.load(sys.stdin)' 2>/dev/null; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          fi
          python3 -c 'import json; d=json.load(open("app/google-services.json")); assert isinstance(d, dict) and d.get("client")' || { echo "::error::app/google-services.json is not a valid Firebase config"; exit 1; }

      - name: Build debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate built APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Attach APK to the release for this tag
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
